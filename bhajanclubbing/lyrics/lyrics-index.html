<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF9F6">
<meta property="og:title" content="Bhajan Clubbing Lyrics">
<meta property="og:description" content="Search any song and sing along. Americans4Hindus (A4H) Bhajan Clubbing, October 23, 2026.">

<title>Bhajan Clubbing Lyrics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap">
<style>
/* Layout: sticky header (brand, display panel, scrolling song tabs) over one reading column; Home = search first, set list below.
   Palette: ink (text), marigold (accent), lamp (surface), ash (muted), rule (lines). */
:root{
  --bg:#FBF9F6; --surface:#FFFFFF; --ink:#241C17; --ash:#6E625A; --rule:#E6DED6;
  --accent:#B8480A; --accent-ink:#FFFFFF; --accent-soft:#FBE9D8; --hit:#FFF1DE;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-dev:"Noto Sans Devanagari","Kohinoor Devanagari","Mangal",system-ui,sans-serif;
  --fs:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16110E; --surface:#201915; --ink:#F4ECE4; --ash:#B3A59A; --rule:#3A2F28;
  --accent:#F2A33A; --accent-ink:#1B1209; --accent-soft:#3A2814; --hit:#2D2116; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16110E; --surface:#201915; --ink:#F4ECE4; --ash:#B3A59A; --rule:#3A2F28;
  --accent:#F2A33A; --accent-ink:#1B1209; --accent-soft:#3A2814; --hit:#2D2116; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:44rem;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px;max-width:44rem;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.01em;flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;color:inherit}
.brand img{border-radius:50%;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:10px;min-height:40px;min-width:40px;padding:0 12px;font-weight:600}
.btn[aria-pressed="true"],.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.panel{max-width:44rem;margin:0 auto;padding-block:4px 14px;display:grid;gap:12px}
.panel[hidden]{display:none}
.panel .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.panel .lbl{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ash);width:100%}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;max-width:44rem;margin:0 auto;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.92rem;white-space:nowrap}
.tab b{color:var(--accent);margin-right:6px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] b{color:inherit}

/* home */
.hero{padding-block:22px 8px}
.welcome{display:flex;align-items:center;gap:14px;margin:0 0 22px;padding:12px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:14px}
.welcome img{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none}
.welcome p{margin:0}
.welcome .w1{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ash)}
.welcome .w2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.2}
.welcome .w3{font-size:.88rem;color:var(--ash)}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);margin:0 0 6px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,8vw,3rem);line-height:1.05;margin:0 0 8px;text-wrap:balance}
.lede{color:var(--ash);margin:0 0 18px;max-width:34rem}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:1.2rem;padding:16px 16px 16px 48px;border-radius:14px;border:2px solid var(--rule);background:var(--surface);color:var(--ink)}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:22px;height:22px;stroke:var(--ash)}
.results{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--rule);border-radius:14px;background:var(--surface);overflow:hidden}
.results li{margin:0}
.res{width:100%;display:flex;align-items:baseline;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:14px 16px;min-height:52px}
.results li:last-child .res{border-bottom:0}
.res[aria-selected="true"],.res:hover{background:var(--hit)}
.res .n{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;min-width:1.6em}
.res .t{font-weight:600;font-size:1.08rem;flex:1;min-width:0}
.res .g{font-size:.8rem;color:var(--ash)}
.direct{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--accent-soft);font-size:.85rem;font-weight:600;color:var(--accent)}
.none{padding:16px;color:var(--ash)}
.setlist{padding-block:26px 8px}
.setlist h2{font-family:var(--f-display);font-size:1.15rem;margin:22px 0 8px;display:flex;gap:10px;align-items:baseline}
.setlist h2 small{font-family:var(--f-ui);color:var(--ash);font-weight:500;font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:8px}
.card{display:flex;gap:10px;align-items:baseline;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;min-height:48px}
.card:hover{border-color:var(--accent)}
.card .n{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;min-width:1.6em}
.foot a{color:var(--accent);font-weight:600}
.foot{margin-top:28px;color:var(--ash);font-size:.85rem;max-width:34rem}

/* song */
.song{padding-block:22px 24px}
.song h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,6.5vw,2.4rem);line-height:1.1;margin:0 0 20px;text-wrap:balance}
.lyrics{font-size:var(--fs);line-height:1.35}
.ln{padding:.34em 0}
.dv{font-family:var(--f-dev);font-weight:500;font-size:1.12em;line-height:1.5}
.rm{color:var(--ash);font-size:.68em;line-height:1.35;margin-top:.1em}
.lat{font-weight:600;font-size:1em}
.ln .rep{display:inline-block;vertical-align:.15em;margin-left:.5em;font-size:.6em;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:.05em .6em;font-family:var(--f-ui)}
.sg{display:none;font-size:.6em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-right:.6em;font-family:var(--f-ui);vertical-align:.1em}
.cues .sg{display:inline}
.cue{display:none;font-size:.62em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:1.1em 0 .1em;font-family:var(--f-ui)}
.cues .cue{display:block}
.mus{display:flex;align-items:center;gap:.7em;margin:1em 0;color:var(--ash);font-size:.62em;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-family:var(--f-ui)}
.mus::before,.mus::after{content:"";flex:1;height:1px;background:var(--rule)}
.tagc{display:inline-block;font-size:.58em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:.05em .55em;margin:.7em 0 .1em;font-family:var(--f-ui)}
body.no-roman .rm{display:none}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:30px}
.nav button{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;min-height:64px;min-width:0}
.nav button:last-child{text-align:right;align-items:flex-end}
.nav small{color:var(--ash);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase}
.nav span{font-weight:600;overflow-wrap:anywhere}
.nav button:disabled{visibility:hidden}
@media (prefers-reduced-motion:no-preference){.tab,.card,.res{transition:background .12s,border-color .12s}}
[hidden]{display:none!important}
</style>

</head>

<script>
(function(){
"use strict";
var SONGS=JSON.parse(document.getElementById('data').textContent);
var $=function(s){return document.querySelector(s)};
var main=$('#main'), tabsEl=$('#tabs'), root=document.documentElement;
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- preferences ---------- */
var fs=parseInt(store.get('bc_fs','24'),10); if(!(fs>=16&&fs<=44)) fs=24;
function applyFs(){root.style.setProperty('--fs',fs+'px');store.set('bc_fs',String(fs))}
applyFs();
$('#fsm').onclick=function(){fs=Math.max(16,fs-2);applyFs()};
$('#fsp').onclick=function(){fs=Math.min(44,fs+2);applyFs()};
var roman=store.get('bc_roman','1')==='1', cues=store.get('bc_cues','0')==='1';
function applyToggles(){
  document.body.classList.toggle('no-roman',!roman); document.body.classList.toggle('cues',cues);
  $('#tgRoman').setAttribute('aria-pressed',roman); $('#tgCues').setAttribute('aria-pressed',cues);
  store.set('bc_roman',roman?'1':'0'); store.set('bc_cues',cues?'1':'0');
}
applyToggles();
$('#tgRoman').onclick=function(){roman=!roman;applyToggles()};
$('#tgCues').onclick=function(){cues=!cues;applyToggles()};
function applyTheme(t){
  if(t==='light'||t==='dark') root.setAttribute('data-theme',t); else root.removeAttribute('data-theme');
  store.set('bc_theme',t);
  document.querySelectorAll('[data-theme-btn]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-theme-btn')===t)});
}
applyTheme(store.get('bc_theme','auto'));
document.querySelectorAll('[data-theme-btn]').forEach(function(b){b.onclick=function(){applyTheme(b.getAttribute('data-theme-btn'))}});
$('#aa').onclick=function(){var p=$('#panel');p.hidden=!p.hidden;this.setAttribute('aria-expanded',!p.hidden)};
$('#brand').onclick=function(){go('home')};

/* ---------- search ---------- */
function key(s){
  s=String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  s=s.replace(/[^a-z0-9 ]+/g,' ');
  s=s.replace(/w/g,'v').replace(/z/g,'j').replace(/q/g,'k').replace(/ph/g,'f');
  s=s.replace(/([bcdgjkpstr])h/g,'$1');
  s=s.replace(/ee/g,'i').replace(/oo/g,'u').replace(/(.)\1+/g,'$1');
  return s;
}
function toks(s){
  return key(s).split(/\s+/).filter(Boolean).map(function(t){return t.length>3?t.replace(/a$/,''):t});
}
function lev1(a,b){ // true if edit distance <=1
  if(a===b) return true; var la=a.length,lb=b.length; if(Math.abs(la-lb)>1) return false;
  var i=0; while(i<la&&i<lb&&a[i]===b[i]) i++;
  if(la===lb) return a.slice(i+1)===b.slice(i+1);
  if(la>lb) return a.slice(i+1)===b.slice(i);
  return a.slice(i)===b.slice(i+1);
}
SONGS.forEach(function(s,i){s.n=i+1;s.tt=toks(s.title);s.at=toks(s.alias+' '+s.g)});
function matchTok(q,list,fuzzy){
  for(var i=0;i<list.length;i++){var t=list[i];
    if(t.indexOf(q)===0) return 3;
    if(q.length>=3&&t.indexOf(q)>0) return 2;
    if(fuzzy&&q.length>=4&&t.length>=4&&lev1(q,t)) return 1;
  } return 0;
}
function search(q){
  q=q.trim(); if(!q) return [];
  if(/^\d+$/.test(q)){var one=SONGS[parseInt(q,10)-1];return one?[one]:[]}
  var qt=toks(q); if(!qt.length) return [];
  function run(fuzzy){
    var out=[];
    SONGS.forEach(function(s){
      var score=0,ok=true;
      for(var i=0;i<qt.length;i++){
        var a=matchTok(qt[i],s.tt,fuzzy);
        if(a){score+=a*3;continue}
        var b=matchTok(qt[i],s.at,fuzzy);
        if(b){score+=b;continue}
        ok=false;break;
      }
      if(ok) out.push({s:s,score:score});
    });
    out.sort(function(x,y){return y.score-x.score||x.s.n-y.s.n});
    return out.map(function(o){return o.s});
  }
  var r=run(false); if(r.length) return r;
  r=run(true); if(r.length) return r;
  var joined=key(q).replace(/\s+/g,'');
  return joined.length>=4?SONGS.filter(function(s){return key(s.title).replace(/\s+/g,'').indexOf(joined)>-1}):[];
}

function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
var current='home';

function buildTabs(){
  var h=el('button','tab');h.type='button';h.setAttribute('role','tab');h.dataset.k='home';h.appendChild(document.createTextNode('Search'));
  h.onclick=function(){go('home')};tabsEl.appendChild(h);
  SONGS.forEach(function(s){
    var b=el('button','tab');b.type='button';b.setAttribute('role','tab');b.dataset.k='song'+s.n;
    b.appendChild(el('b','',String(s.n)));b.appendChild(document.createTextNode(s.title));
    b.onclick=function(){go('song'+s.n)};tabsEl.appendChild(b);
  });
}
function markTabs(k){
  tabsEl.querySelectorAll('.tab').forEach(function(t){
    var on=t.dataset.k===k;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;
    if(on){var r=t.getBoundingClientRect(),c=tabsEl.getBoundingClientRect();
      tabsEl.scrollTo({left:tabsEl.scrollLeft+(r.left-c.left)-(c.width-r.width)/2,behavior:'auto'})}
  });
}
function go(k){ if(location.hash.slice(1)!==k){location.hash=k} else route(); }
function route(){
  var k=location.hash.slice(1)||'home', m=/^song(\d+)$/.exec(k);
  if(m&&SONGS[parseInt(m[1],10)-1]){current=k;renderSong(SONGS[parseInt(m[1],10)-1])}
  else{current='home';renderHome()}
  markTabs(current); window.scrollTo(0,0); keepAwake();
}
window.addEventListener('hashchange',route);

  s.items.forEach(function(it){
    if(it.k==='line'){
      var d=el('div','ln'),dev=/[ऀ-ॿ]/.test(it.t);
      var p=el('div',dev?'dv':'lat');
      if(it.s){p.appendChild(el('span','sg',SG[it.s]||it.s))}
      p.appendChild(document.createTextNode(it.t));
      if(dev) p.lang='hi';
      if(it.x){p.appendChild(el('span','rep','×'+it.x))}
      d.appendChild(p);
      if(it.r){d.appendChild(el('div','rm',it.r))}
      ly.appendChild(d);
    } else if(it.k==='cue'){ly.appendChild(el('div','cue',it.t))}
    else if(it.k==='music'){ly.appendChild(el('div','mus',it.t==='Break'?'Break':'Music'))}
    else if(it.k==='tag'){var t=el('div','');t.appendChild(el('span','tagc',it.t));ly.appendChild(t)}
  });
  sec.appendChild(ly);
  var nav=el('div','nav'),pv=SONGS[s.n-2],nx=SONGS[s.n];
  var b1=el('button','');b1.type='button';b1.appendChild(el('small','','← Previous'));b1.appendChild(el('span','',pv?pv.title:''));b1.disabled=!pv;if(pv)b1.onclick=function(){go('song'+pv.n)};
  var b2=el('button','');b2.type='button';b2.appendChild(el('small','','Next →'));b2.appendChild(el('span','',nx?nx.title:''));b2.disabled=!nx;if(nx)b2.onclick=function(){go('song'+nx.n)};
  nav.appendChild(b1);nav.appendChild(b2);sec.appendChild(nav);
  var back=el('button','btn','Search for another song');back.type='button';back.style.marginTop='18px';back.onclick=function(){go('home')};sec.appendChild(back);
  main.appendChild(sec);
}

var lock=null;
function keepAwake(){
  try{ if(navigator.wakeLock&&document.visibilityState==='visible'&&current!=='home'){
    navigator.wakeLock.request('screen').then(function(l){if(lock)try{lock.release()}catch(e){};lock=l}).catch(function(){});
  }}catch(e){}
}
document.addEventListener('visibilitychange',keepAwake);

buildTabs();route();
})();
</script>
