<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A4H • Compact Survey Visual Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#fcf8f0;color:#193354;font:14px/1.28 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.hero{height:69px;background:linear-gradient(105deg,#112448,#42304a 64%,#916846);display:flex;align-items:center;justify-content:center;text-align:center;color:white}.hero small{font-size:9px;color:#ead19a;letter-spacing:2px;font-weight:700}.hero b{display:block;font-size:21px;line-height:1.15}.hero span{font-size:10px;color:#e7dcd1}main{max-width:620px;margin:-5px auto 12px;padding:0 9px;position:relative}.panel{background:white;border:1px solid #e9decf;border-radius:13px;padding:13px 14px;box-shadow:0 4px 18px #162a4710}h1{font-size:21px;margin:0 0 2px;color:#152f54;line-height:1.16}.intro{margin:0 0 9px;color:#657083;font-size:12px}.field{margin:0 0 9px}.question,.field>label{display:block;font-weight:700;color:#193354;font-size:14px;margin:0 0 4px}.stars{display:flex;gap:7px;height:36px;align-items:center}.star{border:0;background:none;font-size:32px;line-height:1;padding:0 2px;color:#aab2bf;cursor:pointer}.star.on{color:#c39a42}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.option{display:flex;align-items:center;gap:6px;border:1px solid #d9dfe7;border-radius:7px;padding:5px 7px;min-height:33px;font-size:12px;line-height:1.1;cursor:pointer}.option input{margin:0;accent-color:#b48a37;flex-shrink:0}.comment{width:100%;min-height:31px;background:#fff;text-align:left;border:1px solid #d3dbe5;border-radius:7px;padding:6px 9px;color:#8993a0;font:13px inherit;cursor:pointer}.contacts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.contacts .field{margin-bottom:6px}.contacts label{font-size:12px}.contacts input{width:100%;height:34px;border:1px solid #d0d8e2;border-radius:7px;padding:6px 8px;font:13px inherit}.contacts .phone{grid-column:1/-1}.check{display:flex;gap:7px;align-items:center;color:#45536a;font-size:12px;margin:2px 0 9px}.check input{accent-color:#b58b37}.btn{display:block;width:100%;border:0;border-radius:8px;background:#192f55;color:white;font-size:15px;font-weight:700;padding:9px;cursor:pointer}.about{border-top:1px solid #e8ddcd;margin-top:9px;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}.about strong{font-size:12px}.about a{font-size:12px;font-weight:700;color:#98732b;white-space:nowrap}.note{font-size:10px;color:#89919c;text-align:center;margin:5px 0 0}.overlay{position:fixed;inset:0;background:#13253c99;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.overlay.open{display:flex}.modal{background:white;border-radius:13px;padding:17px;width:min(100%,480px);box-shadow:0 20px 50px #14233b44}.modal h2{margin:0 0 10px;font-size:18px}.modal textarea{width:100%;height:155px;resize:vertical;border:1px solid #cbd4df;border-radius:8px;padding:10px;font:14px system-ui}.actions{display:flex;gap:8px;justify-content:end;margin-top:10px}.actions button{border:0;border-radius:7px;padding:9px 16px;background:#1a3157;color:white;font-weight:600}.actions .cancel{background:#e9edf2;color:#233653}@media(max-width:370px){.option{font-size:11px;padding:5px}.panel{padding:10px}.hero{height:61px}h1{font-size:19px}}
</style></head><body><header class="hero"><div><small>AMERICANS4HINDUS · MICHIGAN</small><b>Bhajan Clubbing 2026</b><span>Music · Community · Celebration</span></div></header><main><section class="panel"><h1>We'd Love Your Feedback</h1><p class="intro">Three quick questions. Thank you for celebrating with us!</p><div class="field"><label class="question">How would you rate the evening?</label><div class="stars" id="stars"><button class="star" onclick="rate(1)" aria-label="1 star">★</button><button class="star" onclick="rate(2)" aria-label="2 stars">★</button><button class="star" onclick="rate(3)" aria-label="3 stars">★</button><button class="star" onclick="rate(4)" aria-label="4 stars">★</button><button class="star" onclick="rate(5)" aria-label="5 stars">★</button></div></div><div class="field"><label class="question">What did you enjoy most?</label><div class="options"><label class="option"><input type="radio" name="enjoy">Music &amp; Bhajans</label><label class="option"><input type="radio" name="enjoy">Community Atmosphere</label><label class="option"><input type="radio" name="enjoy">Food &amp; Hospitality</label><label class="option"><input type="radio" name="enjoy">Everything!</label><label class="option"><input type="radio" name="enjoy">Nothing in particular</label><label class="option"><input type="radio" name="enjoy">Prefer not to say</label></div></div><div class="field"><label class="question">Any suggestions for future events?</label><button type="button" class="comment" id="commentPreview" onclick="openComment()">Tap to add a comment (optional) …</button></div><div class="contacts"><div class="field"><label>Full Name</label><input placeholder="Full name" autocomplete="name"></div><div class="field"><label>Email Address</label><input type="email" placeholder="Email address" autocomplete="email"></div><div class="field phone"><label>Phone Number</label><input type="tel" placeholder="Phone number" autocomplete="tel"></div></div><label class="check"><input type="checkbox">I'd like to receive updates from Americans4Hindus.</label><button type="button" class="btn" onclick="alert('Visual preview only — no feedback submitted')">Submit Feedback</button><div class="note">VISUAL PREVIEW ONLY — NO DATA SENT</div><div class="about"><strong>Why A4H Matters to Our Families</strong><a href="https://americans4hindus-mi.github.io/bhajanclubbing/why-a4h-matters/">Learn more ↗</a></div></section></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><h2 id="modalTitle">Suggestions for Future Events</h2><textarea id="commentText" placeholder="We'd love to hear your thoughts..."></textarea><div class="actions"><button class="cancel" onclick="closeComment()">Cancel</button><button onclick="saveComment()">Done</button></div></div></div><script>function rate(n){document.querySelectorAll('.star').forEach((b,i)=>b.classList.toggle('on',i<n))}function openComment(){document.getElementById('overlay').classList.add('open');document.getElementById('commentText').focus()}function closeComment(){document.getElementById('overlay').classList.remove('open')}function saveComment(){const v=document.getElementById('commentText').value.trim();document.getElementById('commentPreview').textContent=v?(v.length>65?v.slice(0,65)+'…':v):'Tap to add a comment (optional) …';closeComment()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeComment()});</script></body></html>
